name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv venv --python ${{ matrix.python }} && uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src tests evals scripts
      - name: Unit and contract tests (no network)
        run: .venv/bin/python -m pytest -q
      - name: Re-score the recorded Codex eval run
        run: .venv/bin/python evals/score.py evals/results/v3-plugin-predictions.jsonl --min-end-to-end 0.9

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        env:
          VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfL -o gitleaks.tgz "${base}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${VERSION}_checksums.txt"
          echo "$(grep "_linux_x64.tar.gz" checksums.txt | cut -d' ' -f1)  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git . --redact --exit-code 1

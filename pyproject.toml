[project]
name = "release-guard-mcp"
version = "0.1.0"
description = "MCP server that runs App Store release-readiness checks from inside a coding agent (Codex, ChatGPT, any MCP client). Read-only by default."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James Coholan" }]
requires-python = ">=3.11"
keywords = ["mcp", "codex", "app-store-connect", "release", "ios", "model-context-protocol"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
  "Intended Audience :: Developers",
]
dependencies = [
  "mcp>=2.2,<3",
  "httpx>=0.28,<1",
  "pyjwt[crypto]>=2.10,<3",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6"]

[project.scripts]
release-guard-mcp = "release_guard.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/release_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"portfolio/*" = ["UP031"]  # CSS templates use %-formatting to keep braces literal
